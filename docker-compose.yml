version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kane_backend
    restart: unless-stopped
    environment:
      - DB_PATH=/data/database.sqlite
    volumes:
      - ./data:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kane_frontend
    restart: unless-stopped
    environment:
      - PORT=3000
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
